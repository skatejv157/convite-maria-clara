<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Maria Clara · 15 anos</title>
<meta property="og:title" content="Maria Clara · 15 anos"><meta property="og:description" content="28 de novembro, às 18h">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:#efe3f4;width:100%;overflow-x:hidden}
#wrap{width:100%;overflow:hidden;position:relative}
body{font-family:'Cormorant Garamond',serif;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1;overflow-x:hidden;color:#C2286F}
body.fechado{overflow:hidden;height:100dvh}
.fundo{position:fixed;inset:0;background:linear-gradient(160deg,#FFE3EC,#FFEBDD 38%,#F6E2F6 72%,#E7E4FB)}
#pag{position:relative;width:1080px;height:3050px;margin:0 auto;overflow:hidden}
#pag>*{position:absolute}
.c1{left:-30px;top:-30px;width:840px}.c2{right:-30px;bottom:-30px;width:760px;transform:rotate(180deg)}
.lat{right:-150px;width:auto;top:1300px;height:1100px}
.t{left:0;right:0;text-align:center;letter-spacing:.22em;font-weight:500}
.sc{left:0;right:0;text-align:center;font-family:'Pinyon Script',cursive;font-weight:400;line-height:.92}
.r{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.23,1,.32,1),transform .9s cubic-bezier(.23,1,.32,1)}
.r.on{opacity:1;transform:none}
.dt{left:0;right:0;top:1520px;display:flex;justify-content:center;align-items:center;gap:52px}
.dt .l{font-size:54px;color:#7B4FA3;letter-spacing:.08em;width:190px;text-align:center;padding:10px 0;border-top:2px solid #D9AE6B;border-bottom:2px solid #D9AE6B}
.dt .n{font-size:230px;line-height:1;color:#D2337C;font-weight:500}
.seta{left:50%;top:1110px;width:56px;margin-left:-28px;animation:b 1.8s ease-in-out infinite}
@keyframes b{50%{transform:translateY(16px)}}
#capa{position:fixed;inset:0;z-index:5;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#cena{position:absolute;left:50%;top:50%;width:1080px;height:1920px;margin:-960px 0 0 -540px}
#flo,#porta{position:absolute;top:-1200px;bottom:-1200px;will-change:transform}
#flo{left:0;width:2400px;background:linear-gradient(160deg,#FFE3EC,#F6E2F6 60%,#E7E4FB)}
#flo img{position:absolute;left:0;top:1200px;height:1920px;width:1120px}
#porta{left:-1200px;width:1840px;background:linear-gradient(160deg,#FFE3EC,#FFE9E0 45%,#F8E3F4);box-shadow:14px 0 34px rgba(120,40,90,.3)}
#porta:after{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;background:#E5C184}
#mv{position:absolute;left:0;top:0;width:1080px;height:1920px;will-change:transform}
#mv>*{position:absolute}
.pe{left:0;bottom:0;width:640px;height:620px;overflow:hidden}
.pe img{position:absolute;left:-30px;bottom:-30px;width:640px;transform:scaleY(-1)}
.selo{left:300px;top:640px;width:680px;animation:p 2.4s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.025)}}
#arco span{position:absolute;display:block;font-size:42px;font-weight:600;color:#7B4FA3;line-height:1;white-space:pre}
.saindo #flo,.saindo #porta,.saindo #mv{transition:transform .95s cubic-bezier(.77,0,.175,1)}
.volta #flo,.volta #porta,.volta #mv{transition:transform .4s cubic-bezier(.23,1,.32,1)}
@media (prefers-reduced-motion:reduce){.seta,.selo{animation:none}.r{transition:none}}
</style></head><body class="fechado">
<div class="fundo"></div>
<div id="wrap"><main id="pag" aria-hidden="true">
 <img class="c1" src="flores_canto.webp" alt="">
 <img class="lat r" src="flores_cascata.webp" alt="">
 <img class="c2" src="flores_canto.webp" alt="">
 <h1 class="sc r" style="top:520px;font-size:225px">Maria<br>Clara</h1>
 <p class="t r" style="top:960px;font-size:62px;color:#7B4FA3">15 ANOS</p>
 <svg class="seta" viewBox="0 0 56 30" aria-hidden="true"><path d="M4 4l24 22L52 4" fill="none" stroke="#B9832F" stroke-width="3"/></svg>
 <p class="t r" style="top:1430px;font-size:54px;color:#A26F1F">NOVEMBRO</p>
 <div class="dt r"><span class="l">SÁB</span><span class="n">28</span><span class="l">18:00</span></div>
 <p class="t r" style="top:1790px;font-size:54px;color:#A26F1F">2026</p>
 <h2 class="sc r" style="top:2130px;font-size:120px;color:#7B4FA3">Local</h2>
 <p class="t r" style="top:2290px;font-size:54px;letter-spacing:.1em">SALÃO DE FESTAS</p>
 <p class="t r" style="top:2365px;font-size:72px;letter-spacing:.14em">TENDENCE</p>
</main></div>
<div id="capa" role="button" tabindex="0" aria-label="Abrir o convite de Maria Clara">
 <div id="cena">
  <div id="flo"><img src="flores_cascata.webp" alt=""></div>
  <div id="porta"></div>
  <div id="mv">
   <div class="pe"><img src="flores_canto.webp" alt=""></div>
   <div style="left:0;width:640px;top:170px;font-size:150px;line-height:.95;color:#C2286F;text-align:center;font-family:'Pinyon Script',cursive">Maria<br>Clara</div>
   <div style="left:0;width:640px;top:490px;text-align:center;font-size:44px;letter-spacing:.22em;color:#7B4FA3;font-weight:500">15 ANOS</div>
   <div id="arco" style="inset:0"></div>
   <img class="selo" src="selo.webp" alt="Selo com as iniciais MC" draggable="false">
  </div>
 </div>
</div>
<script>
const $=s=>document.querySelector(s),capa=$('#capa'),cena=$('#cena'),porta=$('#porta'),flo=$('#flo'),mv=$('#mv'),pag=$('#pag');
let ab=false,ini=null,dx=0,mexeu=false,k=1;
function medir(){const w=document.documentElement.clientWidth,h=innerHeight;
 pag.style.zoom=Math.min(w,520)/1080;
 k=Math.max(w/1080,h/1920);cena.style.transform='scale('+k+')'}
addEventListener('resize',medir);medir();
function pos(d){porta.style.transform=mv.style.transform='translateX('+d+'px)';flo.style.transform='translateX('+(-d*.45)+'px)'}
function abrir(){if(ab)return;ab=true;capa.className='saindo';pos(-1500);
 flo.style.transform='translateX(1100px)';
 setTimeout(()=>{document.body.classList.remove('fechado');scrollTo(0,0);pag.removeAttribute('aria-hidden');
  const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');o.unobserve(e.target)}}),{threshold:.15});
  document.querySelectorAll('.r').forEach(e=>o.observe(e))},350);
 setTimeout(()=>capa.remove(),1050)}
capa.addEventListener('pointerdown',e=>{if(ab)return;ini=e.clientX;dx=0;mexeu=false;capa.className='';capa.setPointerCapture(e.pointerId)});
capa.addEventListener('pointermove',e=>{if(ini===null)return;dx=Math.min(0,e.clientX-ini);if(Math.abs(dx)>8)mexeu=true;pos(dx/k)});
const solta=()=>{if(ini===null)return;ini=null;if(!mexeu||-dx>innerWidth*.18)abrir();else{capa.className='volta';pos(0)}};
capa.addEventListener('pointerup',solta);capa.addEventListener('pointercancel',()=>{ini=null;capa.className='volta';pos(0)});
capa.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')abrir()});
document.fonts.ready.then(()=>{const h=$('#arco'),cx=640,cy=980,r=388,g=8,t='ARRASTE PARA ABRIR';
 const sp=[...t].map(c=>{const s=document.createElement('span');s.textContent=c;h.append(s);return s});
 const w=sp.map(s=>s.offsetWidth+g),tot=w.reduce((a,b)=>a+b,0);let c=-tot/2;
 sp.forEach((s,i)=>{const a=(c+w[i]/2)/r;c+=w[i];s.style.left=(cx-r*Math.cos(a)-(w[i]-g)/2)+'px';s.style.top=(cy-r*Math.sin(a)-21)+'px';s.style.transform='rotate('+(a*180/Math.PI-90)+'deg)'})});
</script></body></html>
